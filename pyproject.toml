[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fp-persistence-audit"
version = "0.1.3"
description = "A model-agnostic audit of repeated false-positive recurrence on the same entities"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "Tongchen Zhang"},
]
dependencies = [
  "numpy>=2.2,<2.3",
  "pandas>=2.3,<2.4",
]

[project.urls]
Homepage = "https://github.com/tzhangaca/fp-persistence-audit"
Repository = "https://github.com/tzhangaca/fp-persistence-audit"
Issues = "https://github.com/tzhangaca/fp-persistence-audit/issues"

[project.optional-dependencies]
test = [
  "pytest>=7.4",
  "python-dateutil>=2.8.2",
  "pytz>=2024.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
